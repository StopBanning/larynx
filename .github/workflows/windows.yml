name: windows
# Larynx for Windows (windows/): builds the app, checks the Swift cleanup through the same process the app runs,
# measures the speech model on CPU and DirectML, and dictates into Notepad end to end on the runner's desktop.
on:
  push:
    paths: ['windows/**', 'Sources/LarynxText/**', 'ci/**', 'tests/cases.json', 'tests/meeting-cases.json', 'tests/meetings/**', 'tests/fixtures/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'Sources/LarynxText/**', 'ci/**', 'tests/cases.json', 'tests/meeting-cases.json', 'tests/meetings/**', 'tests/fixtures/**', '.github/workflows/windows.yml']
  workflow_dispatch:
    inputs:
      publish_beta:
        description: "Publish this build as the Windows beta (a pre-release with a fixed download link), if every test passes. main only."
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  app:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: No crash dialogs (a crashed test must fail, not wait for a click)
        run: |
          New-Item -Force "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting" | Out-Null
          Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting" -Name DontShowUI -Value 1
          Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting" -Name Disabled -Value 1
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          branch: swift-6.1.2-release
          tag: 6.1.2-RELEASE
      - name: Build the cleanup process (larynx-text.exe, Swift)
        run: |
          Copy-Item ci/Package.portable.swift Package.swift -Force
          swift build -c release --product larynx-text
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: cargo-${{ runner.os }}-${{ hashFiles('windows/Cargo.lock') }}
      - name: Build larynx.exe (the app) and larynx-cli.exe (the same code with a console, for tools and tests)
        working-directory: windows
        run: cargo build --release --locked --bins
      - name: The cleanup process answers
        timeout-minutes: 2
        run: |
          $exe = (Get-ChildItem .build -Recurse -Filter larynx-text.exe | Where-Object { $_.FullName -match 'release' } | Select-Object -First 1).FullName
          '{"text":"um so we should uh meet on friday","mode":"correspondence"}' | & $exe
          if ($LASTEXITCODE -ne 0) { throw "larynx-text exited with $LASTEXITCODE" }
      - name: Unit tests (with the Swift cleanup)
        timeout-minutes: 10
        working-directory: windows
        run: |
          $env:LARYNX_TEXT_BIN = (Get-ChildItem ../.build -Recurse -Filter larynx-text.exe | Where-Object { $_.FullName -match 'release' } | Select-Object -First 1).FullName
          cargo test --release --locked --lib -- --nocapture
      - name: Stage a self-contained folder
        run: ./windows/ci/stage.ps1 -Dist dist
      - name: Cleanup cases through the staged app, with no toolchain on PATH
        timeout-minutes: 10
        shell: cmd
        run: |
          set PATH=C:\Windows\System32;C:\Windows
          dist\larynx-cli.exe cleanup-check tests\cases.json
          dist\larynx-cli.exe clean correspondence um so I think we should uh move the meeting to thursday
      - uses: actions/cache@v4
        with:
          path: models
          key: parakeet-tdt-0.6b-v3-onnx-int8-v1
      - name: Download the speech model (int8, about 670 MB)
        run: dist/larynx-cli.exe setup --model models/parakeet-int8
      - name: Synthetic speech for the benchmark
        run: ./windows/ci/make-speech.ps1 -Out speech
      - name: A meeting end to end (two tracks, transcribed, notes from a stand-in for the Claude API)
        timeout-minutes: 15
        run: |
          ./windows/ci/make-meeting.ps1 -Out meeting
          $server = Start-Process python -ArgumentList "windows/ci/fake-claude.py","meeting/request.json" -PassThru -NoNewWindow
          Start-Sleep 2
          $env:ANTHROPIC_API_KEY = "ci-stand-in-key"
          $env:LARYNX_CLAUDE_URL = "http://127.0.0.1:8765"
          $env:LARYNX_DATA_DIR = "$PWD/meeting/data"
          dist/larynx-cli.exe meeting --model models/parakeet-int8 --provider cpu meeting/you.wav meeting/call.wav --save | Out-File -Encoding utf8 meeting/out.json
          $code = $LASTEXITCODE
          Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "larynx meeting exited with $code" }
          python windows/ci/check-meeting.py meeting/out.json meeting/request.json meeting/data
          if ($LASTEXITCODE -ne 0) { throw "the meeting check failed" }
      - name: Transcribe the fixture (CPU)
        timeout-minutes: 10
        run: |
          dist/larynx-cli.exe transcribe --model models/parakeet-int8 --provider cpu tests/fixtures/report.wav speech/short.wav 2>&1 | Tee-Object transcribe.txt
          if (-not (Select-String -Path transcribe.txt -Pattern "send the report tomorrow" -Quiet)) { throw "fixture not transcribed" }
      - name: Dictate into Notepad end to end (hold Right Ctrl, speak, let go)
        timeout-minutes: 10
        run: |
          dist/larynx-cli.exe e2e --app dist/larynx.exe --model models/parakeet-int8 --provider cpu --feed speech/fillers.wav --expect "launch|next week" --reject "um|uh" --out e2e
      - name: Screenshot of the pill as PNG
        if: always()
        run: |
          if (Test-Path e2e/pill.bmp) {
            Add-Type -AssemblyName System.Drawing
            $img = [System.Drawing.Image]::FromFile((Resolve-Path e2e/pill.bmp))
            $img.Save("$PWD/e2e/pill.png", [System.Drawing.Imaging.ImageFormat]::Png); $img.Dispose()
            Remove-Item e2e/pill.bmp
          }
      - name: Meeting mode in the real app (echo from speakers, Mute me, Stop, notes via a Claude Code stand-in, cut-off recovery)
        timeout-minutes: 30
        run: |
          if (-not (Test-Path meeting/you.wav)) { ./windows/ci/make-meeting.ps1 -Out meeting }
          dist/larynx-cli.exe e2e-meeting --app dist/larynx.exe --model models/parakeet-int8 --provider cpu --dir meeting --claude windows/target/release/fake-claude.exe --out e2e-meeting
          $code = $LASTEXITCODE
          python windows/ci/check-meeting-app.py e2e-meeting tests/meetings/client-call.json
          if ($LASTEXITCODE -ne 0 -or $code -ne 0) { throw "meeting mode in the app failed (driver $code)" }
      - name: Meeting mode in a bad room (echo off the walls, fan noise, hum, a cheap laptop microphone) and on a Bluetooth headset
        timeout-minutes: 30
        run: |
          $failed = @()
          Add-Type -AssemblyName System.Drawing
          # Each room also draws the panel at another screen scaling (150%, 200%) for its screenshot.
          foreach ($run in @(@{room = "bad"; dpi = 144}, @{room = "headset"; dpi = 192})) {
            $room = $run.room
            Write-Host "=== room: $room, screen at $($run.dpi) dpi"
            dist/larynx-cli.exe e2e-meeting --app dist/larynx.exe --model models/parakeet-int8 --provider cpu --dir meeting --claude windows/target/release/fake-claude.exe --room $room --dpi $run.dpi --quick --out "e2e-room-$room"
            $code = $LASTEXITCODE
            python windows/ci/check-meeting-app.py "e2e-room-$room" tests/meetings/client-call.json --quick
            if ($LASTEXITCODE -ne 0 -or $code -ne 0) { $failed += $room }
            if (Test-Path "e2e-room-$room/panel-muted.bmp") {
              $img = [System.Drawing.Image]::FromFile((Resolve-Path "e2e-room-$room/panel-muted.bmp"))
              $img.Save("$PWD/e2e-room-$room/panel-muted-$($run.dpi)dpi.png", [System.Drawing.Imaging.ImageFormat]::Png); $img.Dispose()
            }
            Remove-Item "e2e-room-$room/panel-muted.bmp", "e2e-room-$room/mic.wav" -ErrorAction SilentlyContinue
          }
          if ($failed) { throw "meeting mode failed in: $($failed -join ', ')" }
      - name: Screenshot of the meeting panel, muted, as PNG
        if: always()
        run: |
          if (Test-Path e2e-meeting/panel-muted.bmp) {
            Add-Type -AssemblyName System.Drawing
            $img = [System.Drawing.Image]::FromFile((Resolve-Path e2e-meeting/panel-muted.bmp))
            $img.Save("$PWD/e2e-meeting/panel-muted.png", [System.Drawing.Imaging.ImageFormat]::Png); $img.Dispose()
            Remove-Item e2e-meeting/panel-muted.bmp, e2e-meeting/mic.wav -ErrorAction SilentlyContinue
          }
      - name: A virtual audio cable (VB-Cable), standing in for speakers and a microphone
        timeout-minutes: 5
        run: |
          Set-Service Audiosrv -StartupType Automatic; Start-Service Audiosrv
          Invoke-WebRequest https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip -OutFile vbcable.zip
          Expand-Archive vbcable.zip vbcable
          # Trust the driver's publisher (from its own signature) so the install doesn't stop to ask.
          $sig = Get-AuthenticodeSignature (Get-ChildItem vbcable -Filter vbaudio_cable64_win10.cat).FullName
          if ($sig.Status -ne 'Valid') { throw "the cable's driver signature is $($sig.Status)" }
          [IO.File]::WriteAllBytes("$PWD/vbcable.cer", $sig.SignerCertificate.Export('Cert'))
          certutil -addstore TrustedPublisher vbcable.cer | Out-Null
          $p = Start-Process vbcable/VBCABLE_Setup_x64.exe -ArgumentList '-i','-h' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the cable's setup exited with $($p.ExitCode)" }
          Start-Sleep 5
          Get-PnpDevice -Class AudioEndpoint | Format-Table Status, FriendlyName -AutoSize | Out-String | Write-Host
          $cable = (Get-PnpDevice -Class MEDIA | Where-Object FriendlyName -like '*VB-Audio*' | Select-Object -First 1).InstanceId
          if (-not $cable) { throw "the cable did not appear" }
          "CABLE_DEVICE=$cable" >> $env:GITHUB_ENV
      - name: Meeting mode through real audio devices (call from the speakers, your voice and the echo in the microphone, microphone blocked then allowed, audio dropping out mid-meeting)
        timeout-minutes: 30
        run: |
          dist/larynx-cli.exe e2e-meeting-devices --app dist/larynx.exe --model models/parakeet-int8 --provider cpu --dir meeting --claude windows/target/release/fake-claude.exe --out e2e-devices
          $code = $LASTEXITCODE
          python windows/ci/check-meeting-devices.py e2e-devices
          if ($LASTEXITCODE -ne 0 -or $code -ne 0) { throw "meeting mode through real devices failed (driver $code)" }
      - name: Screenshots of the meeting panel (microphone blocked, audio dropped), as PNG
        if: always()
        run: |
          Add-Type -AssemblyName System.Drawing
          foreach ($name in @("panel-unplugged", "panel-mic-blocked")) {
            if (Test-Path "e2e-devices/$name.bmp") {
              $img = [System.Drawing.Image]::FromFile((Resolve-Path "e2e-devices/$name.bmp"))
              $img.Save("$PWD/e2e-devices/$name.png", [System.Drawing.Imaging.ImageFormat]::Png); $img.Dispose()
              Remove-Item "e2e-devices/$name.bmp"
            }
          }
      - name: Benchmark on CPU
        timeout-minutes: 10
        run: dist/larynx-cli.exe bench --model models/parakeet-int8 --provider cpu --out bench-cpu.json speech/manifest.json
      - name: Benchmark on DirectML (CI has no GPU; this checks the path works, not its speed)
        timeout-minutes: 10
        continue-on-error: true
        run: |
          dist/larynx-cli.exe bench --model models/parakeet-int8 --provider directml --no-stream --out bench-directml.json speech/manifest.json 2>&1 | Tee-Object directml.txt
          if ($LASTEXITCODE -ne 0) { throw "DirectML did not run (expected on a runner with no GPU): $(Get-Content directml.txt -Raw)" }
      - name: Streaming is as accurate as transcribing the whole recording
        run: |
          $bad = Get-Content bench-cpu.json -Raw | ConvertFrom-Json | Where-Object { $_.stream_wer -gt $_.whole_wer + 0.03 }
          foreach ($r in $bad) { Write-Host "$($r.wav): streamed WER $($r.stream_wer) vs whole $($r.whole_wer)`n  streamed: $($r.stream_text)`n  whole:    $($r.whole_text)" }
          if ($bad) { throw "streaming lost accuracy on $(@($bad).Count) file(s)" }
      - name: Summary
        if: always()
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List | Out-String | Write-Host
          Get-CimInstance Win32_VideoController | Select-Object Name | Format-List | Out-String | Write-Host
          foreach ($f in @("bench-cpu.json", "bench-directml.json")) {
            if (Test-Path $f) {
              "### $f" >> $env:GITHUB_STEP_SUMMARY
              "| file | audio s | whole ms | RTF | WER | streamed: after key-up ms | tail s | WER |" >> $env:GITHUB_STEP_SUMMARY
              "| --- | --- | --- | --- | --- | --- | --- | --- |" >> $env:GITHUB_STEP_SUMMARY
              foreach ($r in (Get-Content $f -Raw | ConvertFrom-Json)) {
                "| $($r.wav) | $([math]::Round($r.seconds,1)) | $([math]::Round($r.whole_ms)) | $([math]::Round($r.whole_rtf,3)) | $([math]::Round($r.whole_wer,3)) | $($r.stream_after_key_up_ms) | $($r.stream_tail_seconds) | $($r.stream_wer) |" >> $env:GITHUB_STEP_SUMMARY
              }
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            bench-*.json
            directml.txt
            transcribe.txt
            speech/manifest.json
            e2e/
            meeting/out.json
            meeting/data/
            e2e-meeting/
            e2e-devices/
            e2e-room-*/
      - uses: actions/upload-artifact@v4
        with:
          name: larynx-windows-x64
          path: dist
  # The Windows beta: only when someone presses "Run workflow" with publish_beta on, on main, after every test above
  # passed. Replaces the one pre-release tagged windows-beta, so testers keep one link:
  # https://github.com/StopBanning/larynx/releases/download/windows-beta/larynx-windows-x64.zip
  beta:
    needs: app
    if: github.event_name == 'workflow_dispatch' && inputs.publish_beta && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: larynx-windows-x64
          path: dist
      - name: Publish the Windows beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../larynx-windows-x64.zip .)
          notes="Larynx for Windows, beta: built from ${GITHUB_SHA::7} on $(date -u +%F), after every Windows test passed (run ${GITHUB_RUN_ID}).

          For testers. It isn't signed yet, so Windows will say the publisher is unknown: choose More info, then Run anyway. Unzip it anywhere and run larynx.exe; the first start downloads the speech model (about 670 MB). If something goes wrong, right-click the tray icon, choose Send a report…, and send the file it saves.

          What CI checks before a beta goes out, and what it can't: docs/WINDOWS.md."
          gh release delete windows-beta -R "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create windows-beta larynx-windows-x64.zip -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Larynx for Windows (beta)" --notes "$notes"
