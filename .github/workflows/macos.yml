name: macOS
# Builds Larynx and runs the Swift test suite on macOS 26 (the Liquid Glass pill needs the macOS 26 SDK).
# GitHub's macOS arm64 machines are often scarce: a run that waits too long for one is marked failed without running
# anything (and emails the maintainer). So pushes that only change docs don't start a run, and a newer push cancels an older
# run still waiting (a cancelled run sends no email).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '!docs/SETTINGS.md', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', '!docs/SETTINGS.md', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build -c release
      - run: swift test
  install:
    # What a stranger gets: scripts/install.sh into an empty home, ad-hoc signed, on a machine that has never seen
    # Larynx (tests/install.py). Permissions and the speech model can't be tested here.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/install.py
  install-macos-15:
    # The README says macOS 15 or later. This is what someone on macOS 15 with its own developer tools gets.
    # Reported but not yet required (Nov 28): the pill's Liquid Glass may need the macOS 26 tools to compile.
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # Someone on macOS 15 who updated their developer tools: the newest Xcode on the machine (version 26 or later).
      - run: |
          x=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          sw_vers; xcode-select -p; swift --version
      - run: python3 tests/install.py
